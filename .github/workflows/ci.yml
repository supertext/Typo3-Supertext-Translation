name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Install TYPO3 core
        run: composer install --no-dev --no-interaction --no-progress
      - name: Supertext SDK glue test
        run: php Tests/SdkTest.php
      - name: Version reports, key check and ping test
        run: php Tests/ReportingTest.php
      - name: Sites from config.yaml test
        run: php Tests/SiteListTest.php
      - name: Translation files test
        run: php Tests/TranslationFilesTest.php
      - name: Interface translations test
        run: php Tests/LanguageFilesTest.php
      - name: Demo entrypoint syntax
        run: sh -n demo/entrypoint.sh

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Install TYPO3 and PHPStan
        run: composer install --no-interaction --no-progress
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
